<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandingkan referensi dan implementasi</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e7e1;color:#111;font:13px/1.5 Arial,sans-serif}header{padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#f5f3ed;border-bottom:1px solid #aaa}h1{font-size:16px;margin:0;margin-right:auto}select,button,a{font:inherit;padding:8px;background:#fff;color:#111;border:1px solid #bbb}a{text-decoration:none}.panels{display:grid;grid-template-columns:34% 66%;height:calc(100vh - 75px);min-height:500px}.reference{overflow:auto;padding:18px;border-right:1px solid #aaa}.reference img{width:100%;display:block}.preview{overflow:auto;padding:18px}.label{font-size:11px;letter-spacing:.1em;margin:0 0 12px;text-transform:uppercase}.frame-box{position:relative;overflow:hidden;background:#fff;border:1px solid #888}iframe{border:0;display:block;transform-origin:top left;background:#f5f3ed}.note{font-size:11px;color:#555;margin:0 0 14px}@media(max-width:800px){.panels{grid-template-columns:1fr;height:auto}.reference{height:45vh}.preview{height:75vh}header{gap:8px}}</style></head><body><header><h1>Referensi ↔ hasil coding</h1><label>Halaman <select id="route"><option value="home">Home</option><option value="work">Work</option><option value="cap">Creative AI Partner</option><option value="matchup">MatchupSkills</option><option value="lumbung">Lumbung Jakut</option><option value="creative">Creative</option><option value="research">Research</option><option value="reader">Paper reader</option><option value="documents">Documents</option><option value="thesis">Thesis reader</option><option value="about">About</option><option value="leadership">Leadership</option><option value="contact">Contact / Menu</option></select></label><label>Ukuran <select id="device"><option value="1440">Desktop 1440</option><option value="768">Tablet 768</option><option value="390">Mobile 390</option></select></label><a id="open" href="en/index.html" target="_blank">Buka penuh ↗</a></header><div class="panels"><section class="reference"><p class="label">Gambar acuan pengguna</p><img id="reference" src="design/references/5.png" alt="Gambar acuan"></section><section class="preview"><p class="label">Website berjalan — dapat diklik dan di-scroll</p><p class="note">Ini adalah iframe website asli dari paket, bukan screenshot hasil render. Perbandingan ini belum ditinjau melalui browser oleh pembuat paket karena akses browser terblokir.</p><div class="frame-box"><iframe id="frame" title="Live local portfolio" src="en/index.html"></iframe></div></section></div><script>const routes={home:['en/index.html',5],work:['en/work/index.html',6],cap:['en/work/creative-ai-partner/index.html',6],matchup:['en/work/matchupskills/index.html',6],lumbung:['en/work/lumbung-jakut/index.html',6],creative:['en/creative-work/index.html',7],research:['en/research/index.html',3],reader:['en/research/jurnal/index.html',3],documents:['en/documents/index.html',3],thesis:['en/documents/thesis/index.html',3],about:['en/education/index.html',4],leadership:['en/leadership/index.html',4],contact:['en/contact/index.html',2]};const q=s=>document.querySelector(s);function size(){const w=Number(q('#device').value),h=w<500?844:900,available=q('.preview').clientWidth-38,scale=Math.min(1,available/w);q('#frame').style.width=w+'px';q('#frame').style.height=h+'px';q('#frame').style.transform='scale('+scale+')';q('.frame-box').style.width=w*scale+'px';q('.frame-box').style.height=h*scale+'px'}q('#route').onchange=()=>{const [url,ref]=routes[q('#route').value];q('#frame').src=url;q('#open').href=url;q('#reference').src='design/references/'+ref+'.png'};q('#device').onchange=size;addEventListener('resize',size);size();</script></body></html>
